[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pytest-mailpit"
version = "0.4.0"
description = "pytest fixtures and a typed client for testing real emails with Mailpit — parallel-safe, no sleeps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Nikolay Chillev" }]
keywords = [
    "pytest",
    "mailpit",
    "email",
    "email-testing",
    "smtp",
    "django",
    "playwright",
    "xdist",
    "testing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pytest>=8.4",
    "requests>=2.32.4",
]

[project.optional-dependencies]
# mailpit_container: start Mailpit in a Docker container for the session.
testcontainers = ["testcontainers[mailpit]>=4.8"]

[project.entry-points.pytest11]
mailpit = "pytest_mailpit.plugin"

[project.urls]
Homepage = "https://github.com/Nikolay-Chillev/pytest-mailpit"
Repository = "https://github.com/Nikolay-Chillev/pytest-mailpit"
Issues = "https://github.com/Nikolay-Chillev/pytest-mailpit/issues"
Changelog = "https://github.com/Nikolay-Chillev/pytest-mailpit/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "allure-pytest>=2.13",
    "coverage>=7.10",
    "django>=5.2",
    "mypy>=2.4",
    "playwright>=1.55",
    "pytest-html>=4.1",
    "pytest-xdist>=3.8",
    "responses>=0.26",
    "testcontainers[mailpit]>=4.8",
    "ruff>=0.16",
    "types-requests>=2.33",
]

[tool.hatch.build.targets.sdist]
# Anchored, so that examples/*/tests and examples/*/README.md stay out.
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
# Integration tests need a running Mailpit, so they only run when selected with -m integration.
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not integration"]
markers = [
    "integration: tests against a real Mailpit server, set MAILPIT_URL to point at it",
]

[tool.coverage.run]
source = ["pytest_mailpit"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "PT",       # pytest style
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Cyrillic test data is deliberate: emails in other alphabets must work.
"tests/**" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# Optional integrations without type hints.
[[tool.mypy.overrides]]
module = [
    "allure",
    "allure.*",
    "django",
    "django.*",
    "pytest_html",
    "pytest_html.*",
    "testcontainers",
    "testcontainers.*",
]
ignore_missing_imports = true
