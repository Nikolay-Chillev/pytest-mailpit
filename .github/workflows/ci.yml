name: CI

on:
  pull_request:
  push:
    branches: [main]
  # publish.yml runs the whole CI on the tagged commit before it builds.
  workflow_call:
  workflow_dispatch:

# A newer push to the same branch makes the running workflow obsolete; on main,
# every commit keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # The distributions as publish.yml builds them, checked on every change, not first at a tag.
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*

  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.14" }
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev
      - run: python -m coverage run -m pytest
      - run: python -m coverage report

  # Service containers only run on Linux runners, so the tests against a real Mailpit run on Ubuntu.
  integration:
    name: Integration (Mailpit ${{ matrix.mailpit }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and the newest one.
        mailpit: ["v1.22.3", "latest"]
    services:
      mailpit:
        image: axllent/mailpit:${{ matrix.mailpit }}
        ports:
          - 8025:8025
          - 1025:1025
        env:
          # Reverse DNS lookups of the SMTP client can delay every message by seconds in containers.
          MP_SMTP_DISABLE_RDNS: "true"
          # The link check tests link to Mailpit itself, an internal address (Mailpit 1.29.2+).
          MP_ALLOW_INTERNAL_HTTP_REQUESTS: "true"
          # SMTP errors on purpose, for the mailpit_chaos tests.
          MP_ENABLE_CHAOS: "true"
    env:
      MAILPIT_URL: http://localhost:8025/
      MAILPIT_SMTP: localhost:1025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev
      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium
      - name: Wait for Mailpit
        run: curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 "${MAILPIT_URL}api/v1/info"
      - run: python -m pytest -m integration

  # The recipes in examples/ must keep working as documented.
  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[testcontainers]" requests
      - name: Start the docker compose example
        working-directory: examples/docker-compose
        run: docker compose up --detach --build --wait --wait-timeout 120
      - name: Test the docker compose example
        working-directory: examples/docker-compose
        run: python -m pytest tests
      - name: Stop the docker compose example
        if: ${{ always() }}
        working-directory: examples/docker-compose
        run: docker compose down
      - name: Test the docker compose example from a container
        working-directory: examples/docker-compose
        run: docker compose -f compose.yaml -f compose.tests.yaml run --rm --build tests
      - name: Stop the docker compose example with the tests container
        if: ${{ always() }}
        working-directory: examples/docker-compose
        run: docker compose -f compose.yaml -f compose.tests.yaml down
      - name: Test the Testcontainers example
        run: python -m pytest examples/testcontainers

  # The framework examples, Django on the oldest supported version and the newest.
  frameworks:
    name: ${{ matrix.name }} example
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Django 5.2, example: django, packages: pytest-django django~=5.2.0 }
          - { name: Django 6.1, example: django, packages: pytest-django django~=6.1.0 }
          - { name: Flask, example: flask, packages: flask flask-mail }
          - { name: FastAPI, example: fastapi, packages: fastapi httpx2 pytest-asyncio }
    services:
      mailpit:
        image: axllent/mailpit
        ports:
          - 8025:8025
          - 1025:1025
        env:
          MP_SMTP_DISABLE_RDNS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . ${{ matrix.packages }}
      - name: Wait for Mailpit
        run: curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 http://localhost:8025/api/v1/info
      - name: Test the example
        working-directory: examples/${{ matrix.example }}
        run: python -m pytest -W error

  # The single check to require on main: fails if any job failed or was cancelled.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [lint, test, integration, examples, frameworks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the results of the other jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job ended with: $result"
              exit 1
            fi
          done
