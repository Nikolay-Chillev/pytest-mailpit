version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # Only when a new release falls outside a ">=" range: the runtime lower bounds
    # are the oldest supported versions, not something to raise.
    versioning-strategy: increase-if-necessary
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
